  <title id="title">Plan V1 de la maison Varenne — État des lieux</title>
  <desc id="desc">Schéma du rez-de-chaussée : extérieur, entrée, cuisine, salon, bureau et cave. Le hall distribue les trois pièces et la cave est accessible depuis la cuisine par une trappe.</desc>
